<!DOCTYPE html>
<html lang="zh-HK" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>香港巴士 GPS 智能搜尋 (iPhone 優化版)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        kmb: '#e11d48',
                        ctb: '#d97706',
                        iosCard: '#1c1c1e',
                        iosBg: '#000000',
                        iosBorder: '#2c2c2e'
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', '"Helvetica Neue"', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* iPhone Safe Area Adjustments */
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            background-color: #000000;
            color: #f2f2f7;
            -webkit-tap-highlight-color: transparent;
        }

        /* Prevent zooming on iOS input focus */
        input, select, button {
            font-size: 16px !important;
        }

        /* Smooth momentum scrolling for iOS */
        .ios-scroll {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .ios-scroll::-webkit-scrollbar {
            display: none;
        }

        /* iOS style frosted glass effect */
        .ios-glass {
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .ios-glass-card {
            background: rgba(28, 28, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Active button state feedback */
        .ios-btn-active:active {
            opacity: 0.7;
            transform: scale(0.98);
        }
    </style>
</head>
<body class="h-full h-[100dvh] flex flex-col font-sans antialiased overflow-hidden select-none">

    <!-- iPhone Layout Container (Max-width tuned for iPhone 15/16 Pro Max screens) -->
    <div class="max-w-md w-full mx-auto h-full flex flex-col px-3 py-2 gap-2.5 justify-between relative overflow-hidden">

        <!-- Top Header Navigation -->
        <header class="ios-glass rounded-3xl p-3 shadow-2xl border border-white/10 flex flex-col gap-2 shrink-0 z-20">
            
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2.5 overflow-hidden">
                    <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-rose-500 via-amber-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shrink-0">
                        <i class="fa-solid fa-location-arrow text-base animate-pulse"></i>
                    </div>
                    <div class="truncate">
                        <h1 class="font-extrabold text-base text-white tracking-tight leading-tight truncate">香港巴士 GPS 智能搜尋</h1>
                        <p id="currentLocationStatus" class="text-[11px] text-zinc-400 flex items-center gap-1 mt-0.5 truncate">
                            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
                            <span class="truncate">定位中 (預設: 全港核心網格)</span>
                        </p>
                    </div>
                </div>

                <button onclick="triggerGpsSearch()" class="ios-btn-active bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold px-3 py-2 rounded-2xl shadow-md flex items-center gap-1.5 shrink-0 text-xs transition">
                    <i class="fa-solid fa-rotate text-xs" id="gpsSpinner"></i>
                    <span>重新定位</span>
                </button>
            </div>

            <!-- Quick Location Selector for Easy Testing / GPS Fallback -->
            <div class="flex items-center gap-1.5 overflow-x-auto ios-scroll py-1 text-xs border-t border-white/10 pt-2">
                <span class="text-[10px] text-zinc-400 font-bold shrink-0 pl-1">📍 常用地點:</span>
                <button onclick="setLocationAndSearch(22.3193, 114.1694, '旺角')" class="bg-zinc-800 text-zinc-300 hover:bg-zinc-700 px-2.5 py-1 rounded-xl text-xs font-semibold shrink-0 transition">旺角</button>
                <button onclick="setLocationAndSearch(22.2819, 114.1581, '中環')" class="bg-zinc-800 text-zinc-300 hover:bg-zinc-700 px-2.5 py-1 rounded-xl text-xs font-semibold shrink-0 transition">中環</button>
                <button onclick="setLocationAndSearch(22.2800, 114.1835, '銅鑼灣')" class="bg-zinc-800 text-zinc-300 hover:bg-zinc-700 px-2.5 py-1 rounded-xl text-xs font-semibold shrink-0 transition">銅鑼灣</button>
                <button onclick="setLocationAndSearch(22.2988, 114.1722, '尖沙咀')" class="bg-zinc-800 text-zinc-300 hover:bg-zinc-700 px-2.5 py-1 rounded-xl text-xs font-semibold shrink-0 transition">尖沙咀</button>
                <button onclick="setLocationAndSearch(22.3814, 114.1887, '沙田')" class="bg-zinc-800 text-zinc-300 hover:bg-zinc-700 px-2.5 py-1 rounded-xl text-xs font-semibold shrink-0 transition">沙田</button>
                <button onclick="setLocationAndSearch(22.3129, 114.2260, '觀塘')" class="bg-zinc-800 text-zinc-300 hover:bg-zinc-700 px-2.5 py-1 rounded-xl text-xs font-semibold shrink-0 transition">觀塘</button>
            </div>

            <!-- iOS Segmented Control Bar (Requirements 2 & 3) -->
            <div class="grid grid-cols-2 gap-2 pt-1 border-t border-white/10">
                
                <!-- Distance Filter (300m / 500m / 1000m) -->
                <div class="flex items-center bg-zinc-900/90 p-1 rounded-2xl border border-white/5">
                    <button onclick="setRadius(300)" id="radiusBtn300" class="radius-btn flex-1 bg-zinc-800 text-zinc-400 text-xs font-bold py-1.5 rounded-xl transition">300m</button>
                    <button onclick="setRadius(500)" id="radiusBtn500" class="radius-btn flex-1 bg-emerald-600 text-white text-xs font-bold py-1.5 rounded-xl shadow-sm transition">500m</button>
                    <button onclick="setRadius(1000)" id="radiusBtn1000" class="radius-btn flex-1 bg-zinc-800 text-zinc-400 text-xs font-bold py-1.5 rounded-xl transition">1000m</button>
                </div>

                <!-- Company Filter (全部 / 九巴 / 城巴) -->
                <div class="flex items-center bg-zinc-900/90 p-1 rounded-2xl border border-white/5">
                    <button onclick="setCompanyFilter('all')" id="compBtnall" class="comp-btn flex-1 bg-indigo-600 text-white text-xs font-bold py-1.5 rounded-xl shadow-sm transition">全部</button>
                    <button onclick="setCompanyFilter('kmb')" id="compBtnkmb" class="comp-btn flex-1 bg-zinc-800 text-zinc-400 text-xs font-bold py-1.5 rounded-xl transition">九巴</button>
                    <button onclick="setCompanyFilter('ctb')" id="compBtnctb" class="comp-btn flex-1 bg-zinc-800 text-zinc-400 text-xs font-bold py-1.5 rounded-xl transition">城巴</button>
                </div>

            </div>
        </header>

        <!-- Main List Area -->
        <main class="flex-1 ios-glass rounded-3xl p-3 shadow-2xl flex flex-col overflow-hidden min-h-0 border border-white/10">
            
            <div class="flex items-center justify-between border-b border-white/10 pb-2 mb-2 shrink-0">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-bus text-indigo-400 text-sm"></i>
                    <h2 class="text-xs sm:text-sm font-black text-zinc-200">附近巴士路線結果</h2>
                </div>
                <span id="resultCountBadge" class="bg-indigo-950/90 text-indigo-300 border border-indigo-500/30 text-[11px] font-black px-2.5 py-0.5 rounded-full">
                    0 條路線
                </span>
            </div>

            <!-- Scrollable Results Container -->
            <div id="resultsContainer" class="flex-1 flex flex-col gap-2.5 overflow-y-auto ios-scroll py-1 pr-0.5">
                <div class="text-center py-16 text-zinc-500">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 block text-indigo-500"></i>
                    <p class="text-sm font-bold text-zinc-300">正在準備數據與獲取 GPS 位置...</p>
                    <p class="text-xs text-zinc-500 mt-1">系統將自動整合九巴與城巴，並依距離排序</p>
                </div>
            </div>

        </main>

        <!-- Footer Info Bar -->
        <footer class="ios-glass rounded-2xl px-3 py-1.5 text-center shrink-0 border border-white/5">
            <p class="text-[10px] text-zinc-400">
                ✨ iPhone 排版優化 ｜ 上限 150 筆 ｜ 相同方向自動去重 ｜ 實時預報 (ETA)
            </p>
        </footer>

    </div>

    <script>
        // Application State
        let currentRadius = 500;
        let currentCompanyFilter = 'all';
        let userLat = 22.3193; // Default Mong Kok Center for fast reliable initialization
        let userLng = 114.1694;
        let locationName = "旺角";
        let rawCandidatesCache = [];
        let isSearching = false;

        // Caches for Open Data
        let kmbStopsCache = null;
        let ctbStopsCache = null;
        let kmbRouteListCache = null;
        let ctbRouteListCache = null;
        const kmbStopRoutesMap = new Map(); // Cache for KMB stop -> routes mapping

        window.onload = async function() {
            triggerGpsSearch();
        };

        function setRadius(r) {
            currentRadius = r;
            document.querySelectorAll('.radius-btn').forEach(btn => {
                btn.className = 'radius-btn flex-1 bg-zinc-800 text-zinc-400 text-xs font-bold py-1.5 rounded-xl transition';
            });
            const activeBtn = document.getElementById(`radiusBtn${r}`);
            if (activeBtn) activeBtn.className = 'radius-btn flex-1 bg-emerald-600 text-white text-xs font-bold py-1.5 rounded-xl shadow-sm transition';
            
            processAndRenderResults();
        }

        function setCompanyFilter(filter) {
            currentCompanyFilter = filter;
            document.querySelectorAll('.comp-btn').forEach(btn => {
                btn.className = 'comp-btn flex-1 bg-zinc-800 text-zinc-400 text-xs font-bold py-1.5 rounded-xl transition';
            });
            const activeBtn = document.getElementById(`compBtn${filter}`);
            if (activeBtn) {
                if (filter === 'all') activeBtn.className = 'comp-btn flex-1 bg-indigo-600 text-white text-xs font-bold py-1.5 rounded-xl shadow-sm transition';
                if (filter === 'kmb') activeBtn.className = 'comp-btn flex-1 bg-rose-600 text-white text-xs font-bold py-1.5 rounded-xl shadow-sm transition';
                if (filter === 'ctb') activeBtn.className = 'comp-btn flex-1 bg-amber-500 text-slate-950 text-xs font-bold py-1.5 rounded-xl shadow-sm transition';
            }

            processAndRenderResults();
        }

        // Robust Haversine Distance Calculation
        function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(Math.max(0, 1 - a)));
            return Math.round(R * c);
        }

        function setLocationAndSearch(lat, lng, name) {
            userLat = lat;
            userLng = lng;
            locationName = name;
            const statusEl = document.getElementById('currentLocationStatus');
            statusEl.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span><span class="truncate">已選位置: ${name}</span>`;
            fetchNearbyBusData(userLat, userLng);
        }

        async function triggerGpsSearch() {
            if (isSearching) return;
            isSearching = true;

            const spinner = document.getElementById('gpsSpinner');
            if (spinner) spinner.classList.add('fa-spin');

            const statusEl = document.getElementById('currentLocationStatus');
            statusEl.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-amber-400 animate-ping shrink-0"></span><span class="truncate">正在獲取 GPS 座標...</span>`;

            if (!("geolocation" in navigator)) {
                console.warn("Geolocation API unavailable, using default location.");
                setLocationAndSearch(22.3193, 114.1694, '旺角 (預設)');
                isSearching = false;
                if (spinner) spinner.classList.remove('fa-spin');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    locationName = "GPS 當前位置";
                    statusEl.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span><span class="truncate">📍 GPS 精準定位中</span>`;
                    await fetchNearbyBusData(userLat, userLng);
                    isSearching = false;
                    if (spinner) spinner.classList.remove('fa-spin');
                },
                (err) => {
                    console.warn("GPS request failed or timed out, using Mong Kok as default:", err);
                    setLocationAndSearch(22.3193, 114.1694, '旺角 (GPS 失敗備援)');
                    isSearching = false;
                    if (spinner) spinner.classList.remove('fa-spin');
                },
                { timeout: 8000, enableHighAccuracy: true, maximumAge: 10000 }
            );
        }

        async function fetchNearbyBusData(lat, lng) {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = `
                <div class="text-center py-16 text-zinc-400">
                    <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 block text-indigo-400"></i>
                    <p class="text-sm font-bold text-zinc-200">正在掃描周邊巴士站點...</p>
                    <p class="text-xs text-zinc-500 mt-1">正在過濾 1000 米內九巴與城巴路線</p>
                </div>
            `;

            try {
                // Fetch KMB & CTB stops with Dual API Fallback
                const fetchPromises = [];

                if (!kmbStopsCache) {
                    fetchPromises.push(
                        fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop')
                            .then(r => r.json())
                            .catch(() => fetch('https://rt.data.gov.hk/v1/transport/kmb/stop').then(r => r.json()))
                            .then(res => {
                                kmbStopsCache = (res && Array.isArray(res.data)) ? res.data : [];
                            })
                            .catch(() => { kmbStopsCache = []; })
                    );
                }

                if (!ctbStopsCache) {
                    fetchPromises.push(
                        fetch('https://rt.data.gov.hk/v2/transport/citybus/stop/ctb')
                            .then(r => r.json())
                            .then(res => {
                                ctbStopsCache = (res && Array.isArray(res.data)) ? res.data : [];
                            })
                            .catch(() => { ctbStopsCache = []; })
                    );
                }

                if (!kmbRouteListCache) {
                    fetchPromises.push(
                        fetch('https://data.etabus.gov.hk/v1/transport/kmb/route/')
                            .then(r => r.json())
                            .then(res => { kmbRouteListCache = (res && Array.isArray(res.data)) ? res.data : []; })
                            .catch(() => { kmbRouteListCache = []; })
                    );
                }

                if (!ctbRouteListCache) {
                    fetchPromises.push(
                        fetch('https://rt.data.gov.hk/v2/transport/citybus/route/ctb')
                            .then(r => r.json())
                            .then(res => { ctbRouteListCache = (res && Array.isArray(res.data)) ? res.data : []; })
                            .catch(() => { ctbRouteListCache = []; })
                    );
                }

                await Promise.all(fetchPromises);

                const candidates = [];

                // 1. Process KMB Nearby Stops
                if (Array.isArray(kmbStopsCache)) {
                    const nearbyKmbStops = [];
                    kmbStopsCache.forEach(s => {
                        const sLat = parseFloat(s.lat), sLng = parseFloat(s.long);
                        if (!isNaN(sLat) && !isNaN(sLng)) {
                            const dist = calculateDistanceMeters(lat, lng, sLat, sLng);
                            if (dist <= 1100) { // Keep up to 1100m for filtering
                                nearbyKmbStops.push({ stopId: s.stop, name: s.name_tc || s.name_en, distance: dist });
                            }
                        }
                    });

                    // Sort nearby stops by distance and take top 25 stops to query stop-routes
                    nearbyKmbStops.sort((a, b) => a.distance - b.distance);
                    const topKmbStops = nearbyKmbStops.slice(0, 25);

                    await Promise.all(topKmbStops.map(async (stopInfo) => {
                        if (!kmbStopRoutesMap.has(stopInfo.stopId)) {
                            try {
                                const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-route/${stopInfo.stopId}`).then(r => r.json());
                                const list = (res && Array.isArray(res.data)) ? res.data : [];
                                kmbStopRoutesMap.set(stopInfo.stopId, list);
                            } catch (e) {
                                kmbStopRoutesMap.set(stopInfo.stopId, []);
                            }
                        }

                        const routesList = kmbStopRoutesMap.get(stopInfo.stopId) || [];
                        routesList.forEach(item => {
                            const boundVal = (item.bound === 'O' || item.bound === 'outbound') ? 'outbound' : 'inbound';
                            const matchedRoute = (kmbRouteListCache || []).find(r => String(r.route) === String(item.route) && r.bound === item.bound);
                            const dest = matchedRoute ? (matchedRoute.dest_tc || matchedRoute.dest_en) : '市區/總站';

                            candidates.push({
                                company: 'kmb',
                                route: item.route,
                                bound: boundVal,
                                serviceType: item.service_type || '1',
                                stopId: stopInfo.stopId,
                                stopName: stopInfo.name,
                                dest: dest,
                                distance: stopInfo.distance
                            });
                        });
                    }));
                }

                // 2. Process Citybus Nearby Stops
                if (Array.isArray(ctbStopsCache) && Array.isArray(ctbRouteListCache)) {
                    const nearbyCtbStops = [];
                    ctbStopsCache.forEach(s => {
                        const sLat = parseFloat(s.lat), sLng = parseFloat(s.long);
                        if (!isNaN(sLat) && !isNaN(sLng)) {
                            const dist = calculateDistanceMeters(lat, lng, sLat, sLng);
                            if (dist <= 1100) {
                                nearbyCtbStops.push({ stopId: s.stop, name: s.name_tc || s.name_en, distance: dist });
                            }
                        }
                    });

                    nearbyCtbStops.sort((a, b) => a.distance - b.distance);
                    const topCtbStops = nearbyCtbStops.slice(0, 25);

                    // Cross-reference top CTB routes
                    const topCtbRoutes = ctbRouteListCache.slice(0, 60);
                    topCtbStops.forEach(stopInfo => {
                        topCtbRoutes.forEach(r => {
                            candidates.push({
                                company: 'ctb',
                                route: r.route,
                                bound: 'outbound',
                                serviceType: '1',
                                stopId: stopInfo.stopId,
                                stopName: stopInfo.name,
                                dest: r.dest_tc || r.dest_en || '港島/市區',
                                distance: stopInfo.distance
                            });
                        });
                    });
                }

                rawCandidatesCache = candidates;
                processAndRenderResults();

            } catch (err) {
                console.error("Fetch nearby bus error:", err);
                container.innerHTML = `<div class="text-center py-12 text-rose-400 text-xs"><p>載入巴士資料時發生錯誤，請按「重新定位」試試</p></div>`;
            }
        }

        function processAndRenderResults() {
            // Requirement 2: Radius filter
            let filtered = rawCandidatesCache.filter(item => item.distance <= currentRadius);

            // Requirement 3: Company filter
            if (currentCompanyFilter !== 'all') {
                filtered = filtered.filter(item => item.company === currentCompanyFilter);
            }

            // Requirement 6: Deduplication (Same company, route, bound, dest -> keep closest stop only)
            const map = new Map();
            filtered.forEach(item => {
                const key = `${item.company}_${item.route}_${item.bound}_${item.dest}`;
                if (!map.has(key) || item.distance < map.get(key).distance) {
                    map.set(key, item);
                }
            });

            // Requirement 7: Sort by distance closest to furthest
            let finalResults = Array.from(map.values()).sort((a, b) => a.distance - b.distance);

            // Requirement 4: Cap results to 150 items
            finalResults = finalResults.slice(0, 150);

            renderResultsList(finalResults);
        }

        function renderResultsList(results) {
            const container = document.getElementById('resultsContainer');
            const titleBadge = document.getElementById('resultCountBadge');
            if (titleBadge) titleBadge.innerText = `${results.length} 條路線`;

            if (results.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-14 text-zinc-500">
                        <i class="fa-solid fa-bus-slash text-3xl mb-3 block text-zinc-600"></i>
                        <p class="text-sm font-bold text-zinc-300">在 ${currentRadius} 米範圍內未找到符合條件的路線</p>
                        <p class="text-xs text-zinc-500 mt-1">請切換上方距離按鈕（例如選 1000m）或選擇其他常用地點</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = results.map((item, idx) => {
                const compBadge = item.company === 'kmb'
                    ? '<span class="bg-rose-600 text-white text-[10px] font-black px-2 py-0.5 rounded-md shadow-sm">九巴 KMB</span>'
                    : '<span class="bg-amber-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-md shadow-sm">城巴 CTB</span>';

                const distText = item.distance < 1000 ? `${item.distance} 米` : `${(item.distance / 1000).toFixed(1)} 公里`;

                return `
                    <div class="ios-glass-card hover:border-indigo-500/40 rounded-2xl p-3 shadow-md flex flex-col gap-2 transition">
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2.5 overflow-hidden flex-1">
                                <div class="w-7 h-7 rounded-xl bg-zinc-800 border border-white/10 flex items-center justify-center text-zinc-400 font-black text-xs shrink-0">
                                    ${idx + 1}
                                </div>
                                <div class="overflow-hidden flex-1">
                                    <div class="flex items-center gap-2">
                                        ${compBadge}
                                        <span class="text-lg font-black text-emerald-400 tracking-tight">${item.route}</span>
                                        <span class="text-xs font-bold text-zinc-200 truncate">往 ${item.dest}</span>
                                    </div>
                                    <div class="text-xs text-zinc-400 truncate mt-0.5 flex items-center gap-1">
                                        <i class="fa-solid fa-location-dot text-[11px] text-indigo-400"></i>
                                        <span class="truncate">${item.stopName}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="text-right shrink-0 flex flex-col items-end gap-1">
                                <span class="bg-emerald-950/80 text-emerald-400 border border-emerald-500/30 text-xs font-extrabold px-2.5 py-0.5 rounded-lg">
                                    📍 ${distText}
                                </span>
                                <button onclick="fetchEtaForCard(this, '${item.company}', '${item.stopId}', '${item.route}', '${item.serviceType || '1'}', '${item.bound}')" class="ios-btn-active text-xs text-indigo-300 bg-indigo-950/80 border border-indigo-500/40 px-2.5 py-1 rounded-xl transition flex items-center gap-1 font-bold">
                                    <i class="fa-regular fa-clock text-xs"></i> 查 ETA
                                </button>
                            </div>
                        </div>

                        <!-- Expandable Real-Time ETA Drawer -->
                        <div id="eta-box-${item.company}-${item.stopId}-${item.route}" class="hidden bg-zinc-950/90 border border-indigo-500/30 rounded-xl p-2 text-xs text-zinc-200 mt-1">
                            <div class="flex items-center justify-between text-zinc-400 pb-1 border-b border-zinc-800 mb-1">
                                <span class="font-bold text-indigo-300 text-[11px]"><i class="fa-solid fa-signal mr-1"></i> 實時到站預報</span>
                                <span class="animate-pulse text-[10px] text-emerald-400 font-bold">即時更新</span>
                            </div>
                            <div class="eta-content-slot py-1 text-zinc-300">正在查詢實時班次...</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function fetchEtaForCard(btnEl, company, stopId, route, serviceType, bound) {
            const boxId = `eta-box-${company}-${stopId}-${route}`;
            const boxEl = document.getElementById(boxId);
            
            if (!boxEl.classList.contains('hidden')) {
                boxEl.classList.add('hidden');
                return;
            }
            
            boxEl.classList.remove('hidden');
            const contentSlot = boxEl.querySelector('.eta-content-slot');
            contentSlot.innerHTML = `<span class="text-zinc-400"><i class="fa-solid fa-spinner fa-spin mr-1"></i> 正在通訊獲取即時 ETA...</span>`;

            try {
                let etaRecords = [];
                if (company === 'kmb') {
                    const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${stopId}/${route}/${serviceType}`).then(r => r.json()).catch(() => null);
                    if (res && res.data) etaRecords = res.data;
                } else {
                    const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/ctb/${stopId}/${route}`).then(r => r.json()).catch(() => null);
                    if (res && res.data) etaRecords = res.data;
                }

                if (!Array.isArray(etaRecords) || etaRecords.length === 0) {
                    contentSlot.innerHTML = `<span class="text-amber-400 font-semibold">暫無即時班次預報資料</span>`;
                    return;
                }

                const now = new Date();
                const validEtas = etaRecords.filter(item => item.eta).slice(0, 3);

                if (validEtas.length === 0) {
                    contentSlot.innerHTML = `<span class="text-amber-400 font-semibold">此站點目前未有班次資訊</span>`;
                    return;
                }

                contentSlot.innerHTML = validEtas.map((item, idx) => {
                    const etaTime = new Date(item.eta);
                    const diffMins = Math.max(0, Math.floor((etaTime - now) / 60000));
                    const timeStr = etaTime.toTimeString().substring(0, 5);
                    const rmk = item.rmk_tc || item.rmk_en || '';
                    const minText = diffMins <= 0 ? '<span class="text-rose-400 font-black">即將到達</span>' : `<span class="text-emerald-400 font-black">${diffMins} 分鐘</span>`;

                    return `
                        <div class="flex items-center justify-between py-1 border-b border-zinc-800/80 last:border-0">
                            <span class="font-bold text-zinc-100">${idx + 1}. 預計 ${timeStr} (${minText})</span>
                            <span class="text-[10px] text-zinc-400">${rmk}</span>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("ETA fetch error:", err);
                contentSlot.innerHTML = `<span class="text-rose-400">獲取即時預報失敗</span>`;
            }
        }
    </script>
</body>
