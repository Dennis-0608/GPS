<!DOCTYPE html>
<html lang="zh-HK" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>香港天氣預報智能中心 - 實時氣象與警告</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        weatherCard: '#1c1c1e',
                        weatherBg: '#000000',
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', '"Helvetica Neue"', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            background-color: #000000;
            color: #f2f2f7;
            -webkit-tap-highlight-color: transparent;
        }

        .ios-scroll {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .ios-scroll::-webkit-scrollbar {
            display: none;
        }

        .ios-glass {
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        .ios-glass-card {
            background: rgba(28, 28, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .ios-btn-active:active {
            opacity: 0.7;
            transform: scale(0.98);
        }
    </style>
</head>
<body class="h-full h-[100dvh] flex flex-col font-sans antialiased overflow-hidden select-none">

    <div class="max-w-md w-full mx-auto h-full flex flex-col px-3 py-2 gap-3 justify-between relative overflow-hidden">

        <!-- Header Component -->
        <header class="ios-glass rounded-3xl p-4 shadow-2xl border border-white/10 flex items-center justify-between shrink-0 z-25">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-amber-400 via-orange-500 to-rose-600 flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-cloud-sun-rain text-[20px]"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2.5">
                        <h1 class="font-extrabold text-[24px] text-white tracking-tight">香港天氣預報</h1>
                        <button onclick="fetchAllWeatherData()" class="ios-btn-active bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-2.5 py-1 rounded-xl border border-white/10 transition shadow-md flex items-center gap-1.5 text-[16px] font-bold">
                            <i class="fa-solid fa-rotate-right" id="refreshSpinner"></i>
                            <span>更新</span>
                        </button>
                    </div>
                    <p id="updateTimeText" class="text-[17px] text-zinc-400 flex items-center gap-1 mt-0.5">
                        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
                        <span>天文台實時氣象</span>
                    </p>
                </div>
            </div>
        </header>

        <!-- Main Weather Scrollable Area -->
        <main class="flex-1 ios-scroll flex flex-col gap-3 overflow-y-auto pr-0.5 min-h-0">

            <!-- Main Current Weather Card -->
            <div class="ios-glass-card rounded-3xl p-5 shadow-2xl relative overflow-hidden shrink-0">
                <div class="absolute -right-10 -top-10 w-40 h-40 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -left-10 -bottom-10 w-40 h-40 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

                <div class="grid grid-cols-12 gap-3 items-center">
                    <!-- Left Section: Main Weather Info -->
                    <div class="col-span-6 flex flex-col items-start text-left">
                        <div id="mainWeatherIcon" class="text-amber-400 text-[52px] mb-2 drop-shadow-md">
                            <i class="fa-solid fa-sun"></i>
                        </div>
                        <h2 id="mainTemp" class="text-[44px] sm:text-[56px] font-black text-white tracking-tighter">--°C</h2>
                        <p id="mainCondition" class="text-[22px] sm:text-[24px] font-bold text-zinc-200 mt-1">正在連接香港天文台...</p>
                        <p id="mainUpdateInfo" class="text-[17px] text-zinc-400 mt-1">香港天文台總部數據</p>
                    </div>

                    <!-- Right Section: GPS Location, Humidity & UV Index -->
                    <div class="col-span-6 flex flex-col gap-2">
                        <!-- Currently Location Card -->
                        <div class="bg-zinc-900/80 p-2.5 rounded-2xl border border-white/5 flex items-center gap-2.5">
                            <div class="w-7 h-7 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-[16px] shrink-0">
                                <i class="fa-solid fa-location-dot"></i>
                            </div>
                            <div class="overflow-hidden">
                                <span class="text-[16px] text-zinc-400 block font-bold">目前位置</span>
                                <span id="locationVal" class="text-[18px] font-black text-zinc-100 truncate block">定位中...</span>
                            </div>
                        </div>

                        <!-- Relative Humidity Card -->
                        <div class="bg-zinc-900/80 p-2.5 rounded-2xl border border-white/5 flex items-center gap-2.5">
                            <div class="w-7 h-7 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-[16px] shrink-0">
                                <i class="fa-solid fa-droplet"></i>
                            </div>
                            <div class="overflow-hidden">
                                <span class="text-[16px] text-zinc-400 block font-bold">相對濕度</span>
                                <span id="humidityVal" class="text-[18px] font-black text-zinc-100 truncate block">--%</span>
                            </div>
                        </div>

                        <!-- UV Index Card -->
                        <div class="bg-zinc-900/80 p-2.5 rounded-2xl border border-white/5 flex items-center gap-2.5">
                            <div class="w-7 h-7 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-[16px] shrink-0">
                                <i class="fa-solid fa-sun"></i>
                            </div>
                            <div class="overflow-hidden">
                                <span class="text-[16px] text-zinc-400 block font-bold">紫外線指數</span>
                                <span id="uvVal" class="text-[18px] font-black text-zinc-100 truncate block">--</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 5-Day Forecast Card -->
            <div class="ios-glass-card rounded-3xl p-4 shadow-xl flex flex-col gap-3 shrink-0 mb-2">
                <div class="flex items-center justify-between border-b border-white/10 pb-2">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-calendar-days text-indigo-400 text-[22px]"></i>
                        <h3 class="text-[22px] font-black text-zinc-200">五天天氣預報</h3>
                    </div>
                </div>

                <div id="forecastList" class="grid grid-cols-5 gap-1.5">
                    <div class="col-span-5 text-center py-6 text-zinc-500 text-[20px]">
                        <i class="fa-solid fa-spinner fa-spin mr-1"></i> 正在載入五天預報...
                    </div>
                </div>
            </div>

        </main>

        <!-- Footer Bar -->
        <footer class="ios-glass rounded-2xl px-3 py-2 text-center shrink-0 border border-white/5">
            <p class="text-[16px] text-zinc-400">
                ☁️ 資料來源：香港天文台 Open API ｜ 每 30 分鐘自動更新
            </p>
        </footer>

    </div>

    <script>
        const hkoStations = [
            { name: "日出康城", lat: 22.2950, lng: 114.2710 },
            { name: "牛頭角", lat: 22.3180, lng: 114.2190 },
            { name: "觀塘", lat: 22.3124, lng: 114.2253 },
            { name: "香港天文台總部", lat: 22.3019, lng: 114.1740 },
            { name: "尖沙咀", lat: 22.2988, lng: 114.1722 },
            { name: "黃大仙", lat: 22.3417, lng: 114.1925 },
            { name: "九龍城", lat: 22.3283, lng: 114.1916 },
            { name: "深水埗", lat: 22.3315, lng: 114.1596 },
            { name: "油麻地", lat: 22.3115, lng: 114.1687 },
            { name: "旺角", lat: 22.3190, lng: 114.1694 },
            { name: "紅磡", lat: 22.3050, lng: 114.1860 },
            { name: "沙田", lat: 22.3820, lng: 114.1878 },
            { name: "葵涌", lat: 22.3615, lng: 114.1303 },
            { name: "荃灣", lat: 22.3704, lng: 114.1143 },
            { name: "屯門", lat: 22.3913, lng: 113.9763 },
            { name: "元朗", lat: 22.4456, lng: 114.0222 },
            { name: "將軍澳", lat: 22.3167, lng: 114.2583 },
            { name: "西貢", lat: 22.3813, lng: 114.2773 },
            { name: "東涌", lat: 22.2889, lng: 113.9425 },
            { name: "赤鱲角", lat: 22.3080, lng: 113.9185 },
            { name: "灣仔", lat: 22.2790, lng: 114.1718 },
            { name: "中環", lat: 22.2820, lng: 114.1588 },
            { name: "銅鑼灣", lat: 22.2800, lng: 114.1850 },
            { name: "跑馬地", lat: 22.2714, lng: 114.1820 },
            { name: "山頂", lat: 22.2730, lng: 114.1480 }
        ];

        window.onload = function() {
            fetchAllWeatherData();
            getUserLocation();

            setInterval(() => {
                fetchAllWeatherData();
                getUserLocation();
            }, 30 * 60 * 1000);
        };

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c;
        }

        function getUserLocation() {
            const locEl = document.getElementById('locationVal');
            if (!navigator.geolocation) {
                if (locEl) locEl.innerText = "香港";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    let nearestStation = "香港";
                    let minDistance = Infinity;

                    hkoStations.forEach(station => {
                        const dist = calculateDistance(lat, lng, station.lat, station.lng);
                        if (dist < minDistance) {
                            minDistance = dist;
                            nearestStation = station.name;
                        }
                    });

                    if (locEl) {
                        locEl.innerText = nearestStation;
                    }
                },
                (err) => {
                    if (locEl) locEl.innerText = "香港";
                },
                { timeout: 8000, enableHighAccuracy: true }
            );
        }

        async function fetchAllWeatherData() {
            const spinner = document.getElementById('refreshSpinner');
            if (spinner) spinner.classList.add('fa-spin');

            await Promise.all([
                fetchCurrentWeather(),
                fetchFiveDayForecast()
            ]);

            setTimeout(() => {
                if (spinner) spinner.classList.remove('fa-spin');
                const nowStr = new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
                document.getElementById('updateTimeText').innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span><span>最後更新: ${nowStr}</span>`;
            }, 600);
        }

        async function fetchCurrentWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();

                if (data) {
                    if (data.temperature && Array.isArray(data.temperature.data) && data.temperature.data.length > 0) {
                        const tstItem = data.temperature.data.find(i => i.place === '香港天文台') || data.temperature.data[0];
                        if (tstItem) {
                            document.getElementById('mainTemp').innerText = `${tstItem.value}°C`;
                        }
                    }

                    if (data.humidity && Array.isArray(data.humidity.data) && data.humidity.data.length > 0) {
                        const hum = data.humidity.data[0];
                        document.getElementById('humidityVal').innerText = `${hum.value}%`;
                    } else {
                        document.getElementById('humidityVal').innerText = "暫無數據";
                    }

                    if (data.uvindex && Array.isArray(data.uvindex.data) && data.uvindex.data.length > 0) {
                        const uv = data.uvindex.data[0];
                        const uvDesc = uv.desc ? ` (${uv.desc})` : '';
                        document.getElementById('uvVal').innerText = `${uv.value}${uvDesc}`;
                    } else {
                        document.getElementById('uvVal').innerText = "0 (夜間/低)";
                    }

                    if (data.icon && data.icon.length > 0) {
                        updateWeatherIconAndDesc(data.icon[0]);
                    }
                }
            } catch (err) {
                console.warn("Failed to fetch current weather:", err);
                document.getElementById('mainTemp').innerText = "--°C";
                document.getElementById('mainCondition').innerText = "無法載入天氣數據";
            }
        }

        function updateWeatherIconAndDesc(iconCode) {
            const iconEl = document.getElementById('mainWeatherIcon');
            const condEl = document.getElementById('mainCondition');
            
            let iconHtml = '<i class="fa-solid fa-sun text-amber-400"></i>';
            let desc = "晴朗";

            if ([50, 51, 52, 53, 54].includes(iconCode)) {
                iconHtml = '<i class="fa-solid fa-cloud-sun text-amber-300"></i>';
                desc = "部分時間有陽光";
            } else if ([60, 61, 62, 63, 64, 65].includes(iconCode)) {
                iconHtml = '<i class="fa-solid fa-cloud-rain text-blue-400"></i>';
                desc = "有雨 / 驟雨";
            } else if ([70, 71, 72, 73, 74, 75, 76, 77].includes(iconCode)) {
                iconHtml = '<i class="fa-solid fa-bolt-lightning text-amber-400"></i>';
                desc = "雷暴";
            } else if ([80, 81, 82, 83, 84, 85].includes(iconCode)) {
                iconHtml = '<i class="fa-solid fa-cloud text-slate-300"></i>';
                desc = "多雲";
            }

            iconEl.innerHTML = iconHtml;
            condEl.innerText = desc;
        }

        function getWeatherIconHtmlStatic(iconCode) {
            if ([50, 51, 52, 53, 54].includes(iconCode)) {
                return '<i class="fa-solid fa-cloud-sun text-amber-300"></i>';
            } else if ([60, 61, 62, 63, 64, 65].includes(iconCode)) {
                return '<i class="fa-solid fa-cloud-rain text-blue-400"></i>';
            } else if ([70, 71, 72, 73, 74, 75, 76, 77].includes(iconCode)) {
                return '<i class="fa-solid fa-bolt-lightning text-amber-400"></i>';
            } else if ([80, 81, 82, 83, 84, 85].includes(iconCode)) {
                return '<i class="fa-solid fa-cloud text-slate-300"></i>';
            }
            return '<i class="fa-solid fa-sun text-amber-400"></i>';
        }

        async function fetchFiveDayForecast() {
            const container = document.getElementById('forecastList');
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const data = await res.json();

                if (data && data.weatherForecast && Array.isArray(data.weatherForecast)) {
                    const fiveDays = data.weatherForecast.slice(0, 5);
                    
                    container.innerHTML = fiveDays.map(day => {
                        const dateStr = day.forecastDate;
                        const formattedDate = `${dateStr.substring(4, 6)}/${dateStr.substring(6, 8)}`;
                        const weekDay = day.week.replace('星期', '');
                        const minT = day.forecastMintemp ? day.forecastMintemp.value : '--';
                        const maxT = day.forecastMaxtemp ? day.forecastMaxtemp.value : '--';
                        const iconHtml = getWeatherIconHtmlStatic(day.ForecastIcon || 50);

                        return `
                            <div class="bg-zinc-900/80 p-2 rounded-2xl border border-white/5 flex flex-col items-center justify-between text-center gap-1.5">
                                <span class="text-[13px] font-bold text-zinc-300">${formattedDate}<br><span class="text-[12px] text-zinc-400">(${weekDay})</span></span>
                                <div class="text-[20px] my-0.5">${iconHtml}</div>
                                <div class="flex flex-col items-center gap-0.5">
                                    <span class="text-[14px] font-black text-rose-400">${maxT}°</span>
                                    <span class="text-[14px] font-black text-blue-400">${minT}°</span>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (err) {
                console.warn("Failed to fetch 5-day forecast:", err);
                container.innerHTML = `<div class="col-span-5 text-center text-[16px] text-rose-400 py-4">無法載入五天預報資料</div>`;
            }
        }
    </script>
</body>
</html>
